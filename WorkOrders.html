<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Orders</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--card-2:#f7f1e6;--accent:#1f6f6a;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--healthy:#2d6a3a;--healthy-soft:#d7ead9;--tight:#9a4d0f;--tight-soft:#f6e3c8;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button,input,select,textarea{font:inherit}#app{min-height:100%}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem}
.brand{display:flex;gap:.75rem;align-items:center}.mark{width:36px;height:36px;border-radius:10px;background:var(--accent-ink);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;white-space:nowrap;font-size:.9rem}
.tab:hover{background:rgba(27,24,20,.05)}.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(1100px,100%);margin:0 auto;padding:1.1rem 1.15rem 3rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.page-head h2{margin:0;font-size:1.35rem}.page-head .lede{margin:.2rem 0 0;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .7rem;cursor:pointer}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.success{background:var(--healthy);color:#fff;border-color:var(--healthy)}
.btn.danger{color:var(--over)}.btn.small{padding:.25rem .5rem;font-size:.82rem}.btn.big{padding:.65rem 1rem;font-weight:650}
.btn.ghost{background:transparent}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:100%}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--card-2)}
.pill.open{background:var(--accent-soft);color:var(--accent-ink)}
.pill.pass{background:var(--healthy-soft);color:var(--healthy)}
.pill.fail{background:#f6d9d2;color:var(--over)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.85rem}
.subtabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.subtab{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:.4rem .85rem;cursor:pointer}
.subtab.is-on{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.empty{text-align:center;padding:2rem;color:var(--ink-soft)}
.login-wrap{min-height:70vh;display:grid;place-items:center}.login-card{width:min(400px,100%)}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.4rem}
dialog{border:0;padding:0;background:transparent;overflow:visible}dialog::backdrop{background:rgba(27,24,20,.45)}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:1.15rem;width:min(520px,94vw);box-shadow:var(--shadow);max-height:85vh;overflow:auto}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:650;color:var(--ink-soft)}
.traveler-bar{background:var(--accent-ink);color:#f6f1e7;border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.55rem}
.op-btn{padding:.85rem;text-align:left;border:1px solid var(--rule);border-radius:12px;background:var(--card);cursor:pointer}
.op-btn:hover{border-color:var(--accent)}.op-btn.done{background:var(--healthy-soft);border-color:var(--healthy)}
.op-btn h3{margin:0;font-size:.95rem}.op-btn p{margin:.25rem 0 0;font-size:.78rem;color:var(--ink-soft)}
.step-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.45rem}
.step-item{background:var(--card-2);border-radius:10px;padding:.65rem .8rem}
.step-item.done{background:var(--healthy-soft)}
.warn-box{background:var(--tight-soft);border-radius:12px;padding:.75rem;margin:.65rem 0;font-size:.9rem}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-top:.45rem}
.media-item{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:#fff}
.media-item img,.media-item video{width:100%;display:block;max-height:160px;object-fit:contain;background:#111}
.media-item .cap,.media-item a{display:block;padding:.4rem .5rem;font-size:.78rem;color:var(--accent-ink);word-break:break-all}
.qc-block{margin-top:.85rem;padding-top:.65rem;border-top:1px dashed var(--rule)}
.choice-grid{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0}
.choice{display:block;border:1px solid var(--rule);border-radius:12px;padding:.7rem .85rem;cursor:pointer;background:#fff;text-align:left;width:100%;font:inherit;color:inherit}
.choice:hover{border-color:var(--accent)}
.choice.is-on{border-color:var(--accent-ink);background:var(--accent-soft);font-weight:650}
.notes-box{white-space:pre-wrap;background:var(--card-2);border-radius:10px;padding:.75rem;font-size:.9rem;line-height:1.45}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script src="time-track.js"></script>
<script src="WorkOrders.app.js"></script>
</body>
</html>
