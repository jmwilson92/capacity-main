<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Orders</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--card-2:#f7f1e6;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--healthy:#2d6a3a;--healthy-soft:#d7ead9;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button,input,select,textarea{font:inherit}#app{min-height:100%}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem;flex-wrap:wrap}
.brand{display:flex;gap:.75rem;align-items:center}.mark{width:36px;height:36px;border-radius:10px;background:var(--accent-ink);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;white-space:nowrap;font-size:.9rem}
.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(1100px,100%);margin:0 auto;padding:1.1rem 1.15rem 3rem}
.page-head h2{margin:0;font-size:1.35rem}.lede{margin:.2rem 0 0;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;margin-bottom:1rem}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .7rem;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.success{background:var(--healthy);color:#fff;border-color:var(--healthy)}
.btn.danger{color:var(--over);border-color:#e3b6ad}
.btn.small{padding:.25rem .5rem;font-size:.82rem}.btn.big{padding:.65rem 1rem;font-weight:650}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:100%}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--card-2)}
.pill.open{background:var(--accent-soft);color:var(--accent-ink)}
.pill.pass{background:var(--healthy-soft);color:var(--healthy)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem}
.subtabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.subtab{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:.4rem .85rem;cursor:pointer;font:inherit}
.subtab.is-on{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.empty{text-align:center;padding:2rem;color:var(--ink-soft)}
.login-wrap{min-height:70vh;display:grid;place-items:center}.login-card{width:min(400px,100%)}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.4rem}
dialog{border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(27,24,20,.45)}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:1.15rem;width:min(520px,94vw);max-height:85vh;overflow:auto;box-shadow:var(--shadow)}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:650;color:var(--ink-soft)}
.traveler-bar{background:var(--accent-ink);color:#f6f1e7;border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.op-btn{padding:.85rem;text-align:left;border:1px solid var(--rule);border-radius:12px;background:var(--card);cursor:pointer;font:inherit}
.op-btn.done{background:var(--healthy-soft)}
.step-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.45rem}
.step-item{background:var(--card-2);border-radius:10px;padding:.65rem .8rem}
.step-item.done{background:var(--healthy-soft)}
.choice-grid{display:flex;flex-direction:column;gap:.45rem;margin:.5rem 0}
.choice{display:block;border:1px solid var(--rule);border-radius:12px;padding:.7rem .85rem;cursor:pointer;background:#fff;text-align:left;width:100%;font:inherit}
.choice.is-on{border-color:var(--accent-ink);background:var(--accent-soft);font-weight:650}
.notes-box{white-space:pre-wrap;background:var(--card-2);border-radius:10px;padding:.75rem;font-size:.9rem}
.err{color:var(--over);padding:1rem;background:#f6d9d2;border-radius:10px;margin:1rem}
</style>
</head>
<body>
<div id="app">Loading…</div>
<script src="traveler-log.js"></script>
<script src="downtime-report.js"></script>
<script src="wo-qa.js"></script>
<script src="scorecard.js"></script>
<script>
(function(){
var TT_ACTIVE="capacity-tracker.activeTime";
var TT_STORE="capacity-tracker.v1";
function ttRead(){try{return JSON.parse(sessionStorage.getItem(TT_ACTIVE)||"null");}catch(e){return null;}}
function ttWrite(a){if(!a)sessionStorage.removeItem(TT_ACTIVE);else sessionStorage.setItem(TT_ACTIVE,JSON.stringify(a));}
window.TimeTrack={start:function(session,wo,travelerId){if(!session||!wo)return null;var cur=ttRead();if(cur&&String(cur.workOrderId)===String(wo.id))return cur;if(cur)window.TimeTrack.stop();var active={travelerId:travelerId||"",workOrderId:String(wo.id),workOrderNumber:wo.number||"",chargeCode:(wo.chargeCode&&String(wo.chargeCode).trim())||"UNASSIGNED",productTag:wo.productTag||wo.instructionKind||"",instructionKind:wo.instructionKind||"",personId:String(session.personId||session.userId||""),personName:session.name||"",startedAt:Date.now(),source:"checkin"};ttWrite(active);return active;},stop:function(){var cur=ttRead();ttWrite(null);if(!cur||!cur.startedAt)return null;var endedAt=Date.now();var durationMs=Math.max(0,endedAt-Number(cur.startedAt));if(durationMs<15000)return null;try{var base=JSON.parse(localStorage.getItem(TT_STORE)||"{}");if(!Array.isArray(base.timeEntries))base.timeEntries=[];base.timeEntries.push({id:"te_"+Math.random().toString(36).slice(2,10),personId:cur.personId,personName:cur.personName,workOrderId:cur.workOrderId,workOrderNumber:cur.workOrderNumber,chargeCode:cur.chargeCode||"UNASSIGNED",productTag:cur.productTag||"",instructionKind:cur.instructionKind||"",startedAt:new Date(cur.startedAt).toISOString(),endedAt:new Date(endedAt).toISOString(),durationMs:durationMs,source:"checkin"});base.updatedAt=Date.now();localStorage.setItem(TT_STORE,JSON.stringify(base));}catch(e){}return true;},current:function(){return ttRead();}};
window.addEventListener("beforeunload",function(){try{window.TimeTrack.stop();}catch(e){}});
window.addEventListener("pagehide",function(){try{window.TimeTrack.stop();}catch(e){}});

var STORAGE_KEY="capacity-tracker.v1";
var SESSION_KEY="capacity-tracker.session";
var DEFAULT_CABLE=[{id:"labels",name:"Labels",steps:["Confirm label content","Print","Apply"],qa:["Matches","Adhered"]},{id:"cut",name:"Cut Wire",steps:["Verify wire","Measure","Cut","Stage"],qa:["Correct","Length OK"]},{id:"strip",name:"Strip Wire",steps:["Set strip length","Strip","Inspect"],qa:["No nicks"]},{id:"crimp_circular",name:"Crimp - Circular",steps:["Select tool","Strip","Crimp","Inspect"],qa:["Tooling OK","Window OK"]},{id:"crimp_molex",name:"Crimp - Molex",steps:["Select tool","Strip","Crimp","Inspect"],qa:["Clamps good"]},{id:"solder",name:"Solder",steps:["Prep","Solder","Clean"],qa:["Wetting OK"]},{id:"populate",name:"Populate",needsCrimp:true,steps:["Pinout","Insert","Seat"],qa:["Seated"]},{id:"backshell",name:"Backshell",steps:["Hardware","Torque","Witness"],qa:["Torque OK"]},{id:"heatshrink",name:"Heat Shrink",steps:["Position","Shrink"],qa:["Recovered"]},{id:"continuity",name:"Continuity / Test",steps:["Setup","Test","Record"],qa:["Pass"]}];
var DEFAULT_ASSEMBLY=[{id:"asm_prep",name:"Kit / Prep",steps:["Pull kit","Verify rev","Stage"],qa:["Kit complete"]},{id:"asm_assembly",name:"Assembly",steps:["Sequence","Install","Orient"],qa:["Orientation OK"]},{id:"asm_antiseize",name:"Anti-Seize",steps:["Clean","Apply"],qa:["Coverage OK"]},{id:"asm_loctite",name:"Loctite",steps:["Grade","Apply","Assemble"],qa:["Grade OK"]},{id:"asm_torque",name:"Torque",steps:["Tool","Sequence","Mark"],qa:["Value OK"]},{id:"asm_route",name:"Route / Dress",steps:["Route","Clamp","Radius"],qa:["Routing OK"]},{id:"asm_label",name:"Label",steps:["Apply","Verify"],qa:["Labels OK"]},{id:"asm_inspect",name:"Final / FOD",steps:["Visual","FOD"],qa:["Pass"]}];
var DEFAULT_PRODUCT_ASMS=[{id:"asm_core5",name:"CORE 5 Cable Assembly",productCode:"CORE 5",steps:["Kit vs BOM","Build","Continuity","Visual"],qa:["Pass"],media:[]},{id:"asm_core4",name:"CORE 4 Assembly",productCode:"CORE 4",steps:["Traveler","BOM","Assemble","Test"],qa:["Pass"],media:[]},{id:"asm_kraken",name:"Kraken / POD",productCode:"Kraken POD",steps:["Config","Structure","Assemble","Test"],qa:["Pass"],media:[]}];
var state={data:{workCenters:[],people:[],workOrders:[],assemblies:[],cableOps:[],assemblyOps:[],travelers:[]},session:null,mode:"all",centerFilter:"",query:"",loginError:"",view:"list",activeTravelerId:null,activeOpId:null,forceChangePin:false,pendingNc:null,pendingOpNotes:""};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){if(ch==="&")return "\x26amp;";if(ch==="<")return "\x26lt;";if(ch===">")return "\x26gt;";if(ch==="\"")return "\x26quot;";return "\x26#39;";});}
function uid(p){return p+"_"+Math.random().toString(36).slice(2,9);}
function nowISO(){return new Date().toISOString();}
function formatDur(ms){if(!ms)return "0m";var m=Math.round(ms/60000);if(m<60)return m+"m";return Math.floor(m/60)+"h "+(m%60)+"m";}
function stepText(s){return typeof s==="string"?s:(s&&s.text)||"";}
function normalizeSteps(steps){return (steps||[]).map(function(s){if(typeof s==="string")return{text:s,media:[],stepType:"assembly",projectedHours:0,workCenterId:""};var st=String(s.stepType||s.type||"assembly");if(["assembly","qa","test"].indexOf(st)<0)st="assembly";return{text:String(s.text||""),media:Array.isArray(s.media)?s.media:[],stepType:st,projectedHours:Math.max(0,Number(s.projectedHours)||0),workCenterId:s.workCenterId?String(s.workCenterId):""};});}
function stepTypeLabel(st){return st==="qa"?"QA":st==="test"?"Test":"Assembly";}
function kindLabel(k){return k==="task"?"Task Order":k==="assembly"?"Assembly/POD":k==="product"?"Product/LRU":k==="cable"?"Cable":(k||"Not set");}
function centerName(id){var c=(state.data.workCenters||[]).find(function(x){return String(x.id)===String(id);});return c?c.name:"—";}
function toast(m){var el=document.createElement("div");el.className="toast";el.textContent=m;(document.querySelector(".toasts")||document.body).appendChild(el);setTimeout(function(){el.remove();},2800);}
function ensureOps(list,defaults){if(!list||!list.length)return JSON.parse(JSON.stringify(defaults)).map(function(o){o.steps=normalizeSteps(o.steps);return o;});return list.map(function(o){var d=defaults.find(function(x){return x.id===o.id;})||{};return Object.assign({},d,o,{steps:normalizeSteps(o.steps&&o.steps.length?o.steps:d.steps||[]),qa:o.qa&&o.qa.length?o.qa:(d.qa||[])});});}
function taskStepsForWo(wo){var raw=wo&&Array.isArray(wo.taskSteps)&&wo.taskSteps.length?wo.taskSteps:["Complete task order"];return normalizeSteps(raw).map(function(s){return{text:s.text||"Task step",media:[],stepType:"assembly",projectedHours:0,workCenterId:"",done:false};});}
function pushLog(tr,entry){if(window.TravelerLog&&TravelerLog.push)return TravelerLog.push(tr,entry);if(!tr.activityLog)tr.activityLog=[];var row={id:uid("al"),at:nowISO(),type:entry.type||"note",text:String(entry.text||"").trim(),by:entry.by||"",byId:entry.byId||"",opId:entry.opId||"",opName:entry.opName||""};tr.activityLog.unshift(row);return row;}
function logHtml(tr){if(window.TravelerLog&&TravelerLog.html)return TravelerLog.html(tr);return "";}

function load(){try{var p=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");state.data.workCenters=p.workCenters||[];state.data.people=p.people||[];state.data.workOrders=p.workOrders||[];var asms=(p.assemblies&&p.assemblies.length)?p.assemblies:DEFAULT_PRODUCT_ASMS;state.data.assemblies=asms.map(function(a){return Object.assign({},a,{steps:normalizeSteps(a.steps||[])});});state.data.cableOps=ensureOps(p.cableOps,DEFAULT_CABLE);state.data.assemblyOps=ensureOps(p.assemblyOps,DEFAULT_ASSEMBLY);state.data.travelers=p.travelers||[];}catch(e){}try{var s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");if(s&&s.userId){state.session=s;var u=(state.data.people||[]).find(function(p){return String(p.id)===String(s.personId||s.userId);});if(u&&mustChangePin(u))state.forceChangePin=true;}}catch(e){}}
function save(){var base={};try{base=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}catch(e){}base.workCenters=state.data.workCenters;base.people=state.data.people;base.workOrders=state.data.workOrders;base.travelers=state.data.travelers;if(state.data.assemblies&&state.data.assemblies.length)base.assemblies=state.data.assemblies;if(state.data.cableOps&&state.data.cableOps.length)base.cableOps=state.data.cableOps;if(state.data.assemblyOps&&state.data.assemblyOps.length)base.assemblyOps=state.data.assemblyOps;base.updatedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(base));}
function effectivePin(u){if(!u)return"";if(u.pin!=null&&String(u.pin)!=="")return String(u.pin);return"1111";}
function mustChangePin(u){if(!u)return false;if(u.mustChangePin===false||u.mustChangePin==="false")return false;if(u.mustChangePin===true||u.mustChangePin==="true")return true;return effectivePin(u)==="1111";}
function personByPin(pin){var entered=String(pin||"");return(state.data.people||[]).find(function(u){return effectivePin(u)===entered;});}
function trById(id){return(state.data.travelers||[]).find(function(t){return String(t.id)===String(id);});}
function woById(id){return(state.data.workOrders||[]).find(function(o){return String(o.id)===String(id);});}
function asmById(id){return(state.data.assemblies||[]).find(function(a){return String(a.id)===String(id);});}
function opLib(kind){return kind==="assembly"?state.data.assemblyOps:state.data.cableOps;}
function opDef(kind,opId){return opLib(kind).find(function(o){return o.id===opId;});}
function asmProjectedHours(asm){return normalizeSteps(asm&&asm.steps).reduce(function(sum,s){return sum+(Number(s.projectedHours)||0);},0);}
function applyWiHoursToOrder(wo){if(!wo||wo.instructionKind!=="product"||!wo.assemblyId)return;var asm=asmById(wo.assemblyId);if(!asm)return;var total=asmProjectedHours(asm);wo.hoursFromWi=true;wo.hours=total;wo.remainingHours=total;}
function syncWo(t){var wo=woById(t.workOrderId);if(!wo)return;wo.travelerId=t.id;wo.travelerStatus=t.status;wo.hoursLogged=Math.round(((t.totalMs||0)/36e5)*100)/100;if(t.kind==="product"||t.kind==="task"){var done=(t.steps||[]).filter(function(s){return s.done;}).length;var total=(t.steps||[]).length||1;wo.travelerProgress=Math.round(done/total*100);var cur=(t.steps||[]).find(function(s){return!s.done;});wo.currentOp=cur?stepText(cur):(t.kind==="task"?"Task complete":"Complete");if(t.kind==="product")applyWiHoursToOrder(wo);}else{var ops=opLib(t.kind==="assembly"?"assembly":"cable");wo.travelerProgress=Math.round(((t.completedOps||[]).length/(ops.length||1))*100);wo.currentOp=t.currentOpName||"";}if(t.status==="open"&&wo.status==="queued")wo.status="in-progress";}
function startClock(wo,t){try{if(window.TimeTrack&&state.session&&wo)TimeTrack.start(state.session,wo,t&&t.id);}catch(e){}}
function stopClock(){try{if(window.TimeTrack)TimeTrack.stop();}catch(e){}}

function writeQaFromOp(tr,oid,result,qaUser,nc){
  if(!tr.opRecords[oid])tr.opRecords[oid]={};
  var rec=tr.opRecords[oid];
  rec.qaResult=result;rec.qaBy=qaUser.name;rec.qaAt=nowISO();
  if(result==="pass"&&(tr.completedOps||[]).indexOf(oid)<0)tr.completedOps.push(oid);
  var wo=woById(tr.workOrderId);
  var def=opDef(tr.kind==="assembly"?"assembly":"cable",oid);
  pushLog(tr,{type:result==="pass"?"qa-pass":"qa-fail",text:nc?(nc.category+": "+nc.notes):"",by:qaUser.name,byId:qaUser.id,opId:oid,opName:def?def.name:oid});
  var payload={id:uid("qa"),workOrderId:tr.workOrderId,workOrderNumber:tr.workOrderNumber,chargeCode:(wo&&wo.chargeCode)||"",travelerId:tr.id,opId:oid,opName:def?def.name:oid,kind:tr.kind,result:result,by:qaUser.name,byId:qaUser.id,at:nowISO(),techId:rec.techId||tr.personId||"",techName:rec.techBy||tr.personName||"",productTag:tr.productKey||"",instructionKind:tr.kind,workCenterId:tr.workCenterId||"",complexity:(wo&&wo.complexity)||"medium",nonCompliance:nc||null};
  if(window.WoQa&&WoQa.writeQaRecord)WoQa.writeQaRecord(payload);
  else if(window.Scorecard&&Scorecard.writeQaRecord)Scorecard.writeQaRecord(payload);
  else{try{var base=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");if(!Array.isArray(base.qaRecords))base.qaRecords=[];base.qaRecords.unshift(payload);base.updatedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(base));}catch(e){}}
}

function startTraveler(wo){var t=(state.data.travelers||[]).find(function(x){return String(x.workOrderId)===String(wo.id)&&x.status==="open";});if(!t){var kind=wo.instructionKind||"cable";t={id:uid("tr"),kind:kind,assemblyId:wo.assemblyId||"",workOrderId:wo.id,workOrderNumber:wo.number,workOrderTitle:wo.title||"",workCenterId:wo.workCenterId,personId:state.session.personId||state.session.userId,personName:state.session.name,status:"open",startedAt:nowISO(),completedOps:[],opRecords:{},activityLog:[],totalMs:0,currentOpName:"",productKey:wo.productTag||kind,taskNotes:wo.taskNotes||wo.notes||""};if(kind==="product"){var asm=asmById(wo.assemblyId);t.assemblyName=asm?asm.name:(wo.productTag||"Product");t.steps=normalizeSteps(asm?asm.steps:[]).map(function(s){return{text:s.text,media:s.media||[],stepType:s.stepType||"assembly",projectedHours:Number(s.projectedHours)||0,workCenterId:s.workCenterId||"",done:false};});applyWiHoursToOrder(wo);}else if(kind==="task"){t.assemblyName="Task Order";t.steps=taskStepsForWo(wo);}state.data.travelers.unshift(t);pushLog(t,{type:"checkin",text:"Checked in",by:state.session.name,byId:state.session.personId||state.session.userId});}syncWo(t);save();startClock(wo,t);state.activeTravelerId=t.id;state.activeOpId=null;state.view="run";toast("Checked in · "+wo.number+(wo.chargeCode?" · "+wo.chargeCode:""));render();}
function myPersonId(){if(state.session&&state.session.personId)return state.session.personId;return"";}
function filtered(){var list=(state.data.workOrders||[]).filter(function(o){return o.status!=="complete";});if(state.mode==="mine"){var pid=myPersonId();var name=(state.session&&state.session.name||"").toLowerCase();list=list.filter(function(o){if(pid&&(String(o.assignedTechId)===String(pid)||String(o.assignedQaId)===String(pid)))return true;if(name&&((o.assignedTechName||"").toLowerCase()===name||(o.assignedQaName||"").toLowerCase()===name))return true;return false;});}if(state.centerFilter)list=list.filter(function(o){return String(o.workCenterId)===String(state.centerFilter);});if(state.query){var q=state.query.toLowerCase();list=list.filter(function(o){return(o.number||"").toLowerCase().indexOf(q)>=0||(o.title||"").toLowerCase().indexOf(q)>=0||(o.chargeCode||"").toLowerCase().indexOf(q)>=0;});}return list;}
function shell(inner,title){var who=state.session?esc(state.session.name)+" · "+esc(state.session.role||""):"";var live="";try{if(window.TimeTrack&&TimeTrack.current()){var c=TimeTrack.current();live=' <span class="pill open">Timing '+esc(c.workOrderNumber||"")+(c.chargeCode?" · "+esc(c.chargeCode):"")+"</span>";}}catch(e){}return'<div class="top"><div class="top-row"><div class="brand"><div class="mark">WO</div><div><h1>Work Orders</h1><p>'+(title||"Check in · notes · downtime")+'</p></div></div>'+(state.session?'<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><span class="pill open">'+who+'</span>'+live+'<button class="btn small" data-action="logout">Sign out</button></div>':'')+'</div><nav class="tabs"><a class="tab" href="CapacityTracker.html#dashboard">Work Centers</a><a class="tab" href="CapacityTracker.html#planning">Planning</a><a class="tab is-on" href="WorkOrders.html">Work Orders</a><a class="tab" href="WipBoard.html">WIP Board</a><a class="tab" href="WorkInstructions.html">Work Instructions</a><a class="tab" href="DowntimeLogger.html">Downtime</a><a class="tab" href="Analytics.html">Analytics</a><a class="tab" href="Settings.html">Settings</a></nav></div><div class="wrap">'+inner+'</div><div class="toasts"></div><dialog id="modal"></dialog>';}
function renderLogin(){var people=(state.data.people||[]).slice().sort(function(a,b){return String(a.name||"").localeCompare(String(b.name||""));});var opts='<option value="">Select your name</option>'+people.map(function(p){return'<option value="'+esc(p.id)+'">'+esc(p.name||"Unnamed")+'</option>';}).join("");if(!people.length){return'<div class="login-wrap"><div class="login-card card"><h2 style="margin:0 0 .5rem">Work Orders</h2><p style="color:var(--ink-soft);font-size:.9rem">No employees yet.</p><p><a href="Settings.html">Open Settings</a></p></div></div>';}return'<div class="login-wrap"><div class="login-card card"><h2 style="margin:0 0 .5rem">Sign in</h2><p style="color:var(--ink-soft);font-size:.9rem">Select your name and PIN. First-time PIN is 1111.</p><form data-form="login" style="margin-top:1rem"><label>Name<select class="field" name="personId" required>'+opts+'</select></label><label style="margin-top:.65rem">PIN<input class="field" name="pin" type="password" inputmode="numeric" required></label>'+(state.loginError?'<p style="color:var(--over)">'+esc(state.loginError)+'</p>':'')+'<button class="btn primary" type="submit" style="width:100%;margin-top:1rem">Sign in</button></form></div></div>';}
function renderList(){var list=filtered();var openT=(state.data.travelers||[]).filter(function(t){return t.status==="open";});return shell('<div class="page-head"><div><h2>Work Orders</h2><p class="lede">Check in · log notes on ops · report downtime.</p></div></div><div class="subtabs"><button class="subtab '+(state.mode==="all"?"is-on":"")+'" data-action="mode" data-mode="all">All open</button><button class="subtab '+(state.mode==="mine"?"is-on":"")+'" data-action="mode" data-mode="mine">My work orders</button></div>'+(openT.length?'<div class="card"><h3 style="margin:0 0 .65rem;font-size:.95rem">Resume</h3>'+openT.map(function(t){return'<div style="display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.45rem;align-items:center"><div><b>'+esc(t.workOrderNumber)+'</b> · '+esc(kindLabel(t.kind))+'</div><button class="btn primary small" data-action="resume" data-id="'+t.id+'">Resume</button></div>';}).join("")+'</div>':'')+'<div class="card"><div class="filters"><input class="field" style="min-width:12rem" placeholder="Search…" value="'+esc(state.query)+'" data-bind="query"><select class="field" data-bind="centerFilter"><option value="">All centers</option>'+(state.data.workCenters||[]).map(function(c){return'<option value="'+c.id+'" '+(String(state.centerFilter)===String(c.id)?"selected":"")+'>'+esc(c.name)+'</option>';}).join("")+'</select></div>'+(!list.length?'<div class="empty">No open work orders.</div>':'<div style="overflow-x:auto"><table><thead><tr><th>Job</th><th>Charge</th><th>Complexity</th><th>WI</th><th>Progress</th><th></th></tr></thead><tbody>'+list.map(function(wo){return'<tr><td><b>'+esc(wo.number)+'</b>'+(wo.title?'<div style="font-size:.8rem;color:var(--ink-soft)">'+esc(wo.title)+'</div>':'')+'</td><td>'+(wo.chargeCode?'<span class="pill open">'+esc(wo.chargeCode)+'</span>':'<span class="pill">—</span>')+'</td><td><span class="pill">'+esc(wo.complexity||"medium")+'</span></td><td>'+(wo.productTag||wo.instructionKind?'<span class="pill open">'+esc(wo.productTag||kindLabel(wo.instructionKind))+'</span>':'<span class="pill">Not set</span>')+'</td><td>'+(wo.travelerProgress!=null?wo.travelerProgress+"%":"—")+'</td><td style="white-space:nowrap"><button class="btn small" data-action="tag-wo" data-id="'+wo.id+'">WI / Code</button> <button class="btn small danger" data-action="downtime" data-id="'+wo.id+'">Downtime</button> <button class="btn primary small" data-action="checkin" data-id="'+wo.id+'">Check in</button></td></tr>';}).join("")+'</tbody></table></div>')+'</div>',"Check in starts the clock");}
function renderRun(){var t=trById(state.activeTravelerId);if(!t){state.view="list";return renderList();}if(t.kind==="product")return renderRunProduct(t);if(t.kind==="task")return renderRunTask(t);return renderRunGeneric(t);}
function renderRunTask(t){var steps=t.steps||[];var done=steps.filter(function(s){return s.done;}).length;var notes=t.taskNotes||"";var wo=woById(t.workOrderId);return shell('<div class="traveler-bar"><div><div style="font-size:1.15rem;font-weight:650">'+esc(t.workOrderNumber)+' · Task Order</div><div style="opacity:.85;font-size:.85rem">'+(wo&&wo.chargeCode?esc(wo.chargeCode)+" · ":"")+formatDur(t.totalMs)+' · '+done+'/'+steps.length+'</div></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn small" style="background:#fff" data-action="exit-run">Exit</button><button class="btn small" style="background:#fff" data-action="downtime" data-id="'+t.workOrderId+'">Downtime</button>'+(t.status==="open"?'<button class="btn small success" data-action="finish-traveler">Mark complete</button>':'')+'</div></div><div class="card">'+(notes?'<div class="notes-box">'+esc(notes)+'</div>':'<p style="color:var(--ink-soft);margin:0">Task order</p>')+'</div><div class="card"><h3 style="margin:0 0 .65rem">Checklist</h3><ul class="step-list">'+steps.map(function(s,i){return'<li class="step-item '+(s.done?"done":"")+'"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><div><span class="pill">'+(i+1)+'</span> '+esc(stepText(s))+(s.done&&s.by?'<div style="font-size:.78rem;color:var(--ink-soft)">Signed: '+esc(s.by)+'</div>':'')+'</div>'+(!s.done?'<button class="btn small primary" data-action="prod-step" data-i="'+i+'">Complete · PIN</button>':'<span class="pill pass">Done</span>')+'</div></li>';}).join("")+'</ul></div>'+logHtml(t),"Task Order");}
function renderRunGeneric(t){var kind=t.kind==="assembly"?"assembly":"cable";var ops=opLib(kind);var active=state.activeOpId?opDef(kind,state.activeOpId):null;var rec=active?(t.opRecords[active.id]||{}):{};var doneSet={};(t.completedOps||[]).forEach(function(id){doneSet[id]=true;});var body;if(!active){body='<div class="page-head"><h2>What are you doing?</h2><p class="lede">Pick an operation. Log notes as you go.</p></div><div class="op-grid">'+ops.map(function(op){var r=t.opRecords[op.id]||{};var passed=!!doneSet[op.id];return'<button type="button" class="op-btn '+(passed?"done":"")+'" data-action="pick-op" data-id="'+op.id+'"><h3 style="margin:0;font-size:.95rem">'+esc(op.name)+'</h3><p style="margin:.25rem 0 0;font-size:.78rem;color:var(--ink-soft)">'+(passed?"QA passed":(r.techDone?"Awaiting QA":(op.steps||[]).length+" steps"))+'</p></button>';}).join("")+'</div>';}else{var steps=normalizeSteps(active.steps);body='<button class="btn small" data-action="clear-op">&larr; All ops</button><div class="card" style="margin-top:.65rem"><h2 style="margin:0 0 .5rem">'+esc(active.name)+'</h2><ul class="step-list">'+steps.map(function(s,i){return'<li class="step-item"><span class="pill">'+(i+1)+'</span> '+esc(stepText(s))+'</li>';}).join("")+'</ul><div style="margin-top:.75rem"><b>QA</b><ul class="step-list">'+(active.qa||[]).map(function(q){return'<li class="step-item">'+esc(q)+'</li>';}).join("")+'</ul></div>'+(!rec.techDone?'<label style="margin-top:1rem">What did you do exactly?<textarea class="field" id="op-notes" rows="3" placeholder="e.g. Crimped J1 1-8 with AFM8 / K1461, 22 AWG, window OK">'+esc(rec.techNotes||"")+'</textarea></label>':'')+(rec.techNotes?'<div class="notes-box" style="margin-top:.65rem"><b>Tech notes:</b> '+esc(rec.techNotes)+(rec.techBy?' <span style="color:var(--ink-soft)">— '+esc(rec.techBy)+'</span>':'')+'</div>':'')+'<div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem">'+(!rec.techDone?'<button class="btn primary big" data-action="tech-done" data-opid="'+active.id+'">Tech complete · PIN</button>':'<span class="pill pass">Tech done</span>')+(rec.techDone&&rec.qaResult!=="pass"?'<button class="btn success big" data-action="qa-done" data-opid="'+active.id+'" data-result="pass">QA Pass · PIN</button><button class="btn big" data-action="qa-done" data-opid="'+active.id+'" data-result="fail">QA Fail · PIN</button>':'')+'</div></div>';}var wo=woById(t.workOrderId);return shell('<div class="traveler-bar"><div><div style="font-size:1.15rem;font-weight:650">'+esc(t.workOrderNumber)+' · '+(kind==="assembly"?"Assembly/POD":"Cable")+'</div><div style="opacity:.85;font-size:.85rem">'+(wo&&wo.chargeCode?esc(wo.chargeCode)+" · ":"")+formatDur(t.totalMs)+'</div></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn small" style="background:#fff" data-action="exit-run">Exit</button><button class="btn small" style="background:#fff" data-action="downtime" data-id="'+t.workOrderId+'">Downtime</button>'+(t.status==="open"?'<button class="btn small success" data-action="finish-traveler">Mark complete</button>':'')+'</div></div>'+body+logHtml(t),"Traveler");}
function renderRunProduct(t){var steps=t.steps||[];var done=steps.filter(function(s){return s.done;}).length;var wo=woById(t.workOrderId);return shell('<div class="traveler-bar"><div><div style="font-size:1.15rem;font-weight:650">'+esc(t.workOrderNumber)+' · '+esc(t.assemblyName||"Product")+'</div><div style="opacity:.85;font-size:.85rem">'+(wo&&wo.chargeCode?esc(wo.chargeCode)+" · ":"")+done+'/'+steps.length+'</div></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn small" style="background:#fff" data-action="exit-run">Exit</button><button class="btn small" style="background:#fff" data-action="downtime" data-id="'+t.workOrderId+'">Downtime</button>'+(t.status==="open"?'<button class="btn small success" data-action="finish-traveler">Mark complete</button>':'')+'</div></div><div class="card"><ul class="step-list">'+steps.map(function(s,i){var st=s.stepType||"assembly";return'<li class="step-item '+(s.done?"done":"")+'"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap"><div><span class="pill">'+(i+1)+'</span> <span class="pill">'+esc(stepTypeLabel(st))+'</span> '+esc(stepText(s))+(s.done&&s.by?'<div style="font-size:.78rem;color:var(--ink-soft)">'+esc(s.by)+'</div>':'')+(s.note?'<div class="notes-box" style="margin-top:.35rem">'+esc(s.note)+'</div>':'')+'</div>'+(!s.done?'<button class="btn small primary" data-action="prod-step" data-i="'+i+'">Complete · PIN</button>':'<span class="pill pass">Done</span>')+'</div></li>';}).join("")+'</ul></div>'+logHtml(t),"Product");}
function renderChangePin(){return'<div class="login-wrap"><div class="login-card card"><h2 style="margin:0 0 .5rem">Set your PIN</h2><form data-form="change-pin" style="margin-top:1rem"><label>New PIN<input class="field" name="a" type="password" inputmode="numeric" required minlength="4"></label><label style="margin-top:.65rem">Confirm<input class="field" name="b" type="password" inputmode="numeric" required minlength="4"></label><button class="btn primary" type="submit" style="width:100%;margin-top:1rem">Save</button></form></div></div>';}
function render(){try{if(!state.session){document.getElementById("app").innerHTML=renderLogin();wire();return;}if(state.forceChangePin){document.getElementById("app").innerHTML=renderChangePin();wire();return;}document.getElementById("app").innerHTML=state.view==="run"?renderRun():renderList();wire();}catch(err){document.getElementById("app").innerHTML='<div class="wrap"><div class="err">Work Orders error: '+esc(err&&err.message?err.message:String(err))+'</div></div>';}}
function wire(){document.querySelectorAll("[data-bind]").forEach(function(el){el.addEventListener("input",function(e){state[e.target.getAttribute("data-bind")]=e.target.value;render();});el.addEventListener("change",function(e){state[e.target.getAttribute("data-bind")]=e.target.value;render();});});}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-action]");if(!b)return;var a=b.getAttribute("data-action");
  if(a==="logout"){stopClock();state.session=null;sessionStorage.removeItem(SESSION_KEY);state.view="list";render();}
  if(a==="mode"){state.mode=b.getAttribute("data-mode");render();}
  if(a==="exit-run"){stopClock();state.view="list";state.activeOpId=null;render();}
  if(a==="resume"){state.activeTravelerId=b.getAttribute("data-id");state.activeOpId=null;state.view="run";var t=trById(state.activeTravelerId);var wo=t?woById(t.workOrderId):null;if(wo)startClock(wo,t);render();}
  if(a==="checkin"){var wo=woById(b.getAttribute("data-id"));if(!wo)return;if(!wo.instructionKind){toast("Set WI type first");openTag(wo);return;}if(wo.instructionKind==="product"&&!wo.assemblyId){toast("Pick product WI");openTag(wo);return;}startTraveler(wo);}
  if(a==="tag-wo"){var w2=woById(b.getAttribute("data-id"));if(w2)openTag(w2);}
  if(a==="downtime"){var wd=woById(b.getAttribute("data-id"));if(!wd)return;if(window.DowntimeReport&&DowntimeReport.open){DowntimeReport.open(wd,state.session,function(){toast("Downtime logged — see Downtime tab");});}else{toast("Missing downtime-report.js");}}
  if(a==="add-log"){var trL=trById(state.activeTravelerId);if(!trL)return;if(window.TravelerLog&&TravelerLog.openNoteModal){TravelerLog.openNoteModal(function(text){pushLog(trL,{type:"note",text:text,by:state.session.name,byId:state.session.personId||state.session.userId});save();toast("Logged");render();});}else{var note=prompt("What did you do?");if(note){pushLog(trL,{type:"note",text:note,by:state.session.name,byId:state.session.personId});save();render();}}}
  if(a==="close-modal"){var d=document.getElementById("modal");if(d)d.close();state.pendingNc=null;}
  if(a==="pick-kind"){state.tagKind=b.getAttribute("data-kind");if(state._tagPaint)state._tagPaint();}
  if(a==="pick-asm"){state.tagAssemblyId=b.getAttribute("data-id");if(state._tagPaint)state._tagPaint();}
  if(a==="save-tag")applyTagSave();
  if(a==="pick-op"){var tr=trById(state.activeTravelerId);if(!tr)return;state.activeOpId=b.getAttribute("data-id");if(!tr.opRecords[state.activeOpId])tr.opRecords[state.activeOpId]={};if(!tr.opRecords[state.activeOpId].startedAt)tr.opRecords[state.activeOpId].startedAt=nowISO();var def=opDef(tr.kind==="assembly"?"assembly":"cable",state.activeOpId);tr.currentOpName=def?def.name:state.activeOpId;syncWo(tr);save();render();}
  if(a==="clear-op"){state.activeOpId=null;render();}
  if(a==="tech-done"){var notesEl=document.getElementById("op-notes");state.pendingOpNotes=notesEl?String(notesEl.value||"").trim():"";openPin("tech-done",{opId:b.getAttribute("data-opid")});}
  if(a==="qa-done")openPin("qa-done",{opId:b.getAttribute("data-opid"),result:b.getAttribute("data-result")});
  if(a==="prod-step")openPin("prod-step",{i:Number(b.getAttribute("data-i"))});
  if(a==="finish-traveler"){var tx=trById(state.activeTravelerId);if(!tx)return;tx.status="complete";tx.completedAt=nowISO();var wx=woById(tx.workOrderId);if(wx){wx.travelerProgress=100;wx.currentOp="Complete";}syncWo(tx);save();stopClock();toast("Complete");state.view="list";render();}
});

function openTag(wo){
  state.tagWoId=wo.id;state.tagKind=wo.instructionKind||"cable";
  state.tagAssemblyId=wo.assemblyId||((state.data.assemblies[0]&&state.data.assemblies[0].id)||"");
  state.tagTaskNotes=wo.taskNotes||wo.notes||"";state.tagChargeCode=wo.chargeCode||"";
  state.tagComplexity=wo.complexity||"medium";
  var asms=state.data.assemblies||[];var dlg=document.getElementById("modal");
  function paint(){
    var cxHtml=window.WoQa&&WoQa.complexitySelectHtml?WoQa.complexitySelectHtml(state.tagComplexity):'<label style="margin:.75rem 0">Complexity<select class="field" data-bind-tag="complexity"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>';
    dlg.innerHTML='<div class="modal-card"><h3 style="margin:0">WI / Code / Complexity — '+esc(wo.number)+'</h3><label style="margin:.75rem 0">Charge code<input class="field" data-bind-tag="chargeCode" value="'+esc(state.tagChargeCode)+'"></label>'+cxHtml+'<div style="font-size:.8rem;font-weight:650;color:var(--ink-soft);margin:.5rem 0 .35rem">Instruction type</div><div class="choice-grid"><button type="button" class="choice '+(state.tagKind==="cable"?"is-on":"")+'" data-action="pick-kind" data-kind="cable"><b>Generic cable</b></button><button type="button" class="choice '+(state.tagKind==="assembly"?"is-on":"")+'" data-action="pick-kind" data-kind="assembly"><b>Generic assembly / POD</b></button><button type="button" class="choice '+(state.tagKind==="product"?"is-on":"")+'" data-action="pick-kind" data-kind="product"><b>Product / LRU WI</b></button><button type="button" class="choice '+(state.tagKind==="task"?"is-on":"")+'" data-action="pick-kind" data-kind="task"><b>Task Order</b></button></div>'+(state.tagKind==="product"?'<div style="margin-top:1rem" class="choice-grid">'+asms.map(function(a){return'<button type="button" class="choice '+(String(state.tagAssemblyId)===String(a.id)?"is-on":"")+'" data-action="pick-asm" data-id="'+a.id+'"><b>'+esc(a.name)+'</b></button>';}).join("")+'</div>':'')+(state.tagKind==="task"?'<label style="margin-top:1rem">Task notes<textarea class="field" rows="3" data-bind-tag="taskNotes">'+esc(state.tagTaskNotes)+'</textarea></label>':'')+'<div style="display:flex;justify-content:space-between;margin-top:1rem;gap:.5rem"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="save-tag">Save</button></div></div>';
    dlg.querySelectorAll("[data-bind-tag]").forEach(function(inp){inp.addEventListener("input",function(ev){var k=ev.target.getAttribute("data-bind-tag");if(k==="chargeCode")state.tagChargeCode=ev.target.value;if(k==="taskNotes")state.tagTaskNotes=ev.target.value;if(k==="complexity")state.tagComplexity=ev.target.value;});inp.addEventListener("change",function(ev){var k=ev.target.getAttribute("data-bind-tag");if(k==="complexity")state.tagComplexity=ev.target.value;});});
  }
  paint();dlg.showModal();state._tagPaint=paint;
}
function openPin(purpose,payload){state.pendingPin={purpose:purpose,payload:payload||{}};var dlg=document.getElementById("modal");dlg.innerHTML='<div class="modal-card"><h3 style="margin:0">Enter PIN</h3><form data-form="step-pin"><label style="display:block;margin:1rem 0">PIN<input class="field" name="pin" type="password" inputmode="numeric" required style="margin-top:.35rem"></label><div style="display:flex;justify-content:space-between;gap:.5rem"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Confirm</button></div></form></div>';dlg.showModal();}
function openNc(opId,qaUser){var tr=trById(state.activeTravelerId);var def=tr?opDef(tr.kind==="assembly"?"assembly":"cable",opId):null;state.pendingNc={opId:opId,qaUser:qaUser};var dlg=document.getElementById("modal");dlg.innerHTML=(window.WoQa&&WoQa.ncFormHtml)?WoQa.ncFormHtml(def?def.name:opId):'<form class="modal-card" data-form="qa-nc"><h3>Non-compliance</h3><label>Category<input class="field" name="category" required></label><label>Severity<select class="field" name="severity"><option value="major">Major</option></select></label><label>Notes<textarea class="field" name="notes" required></textarea></label><button class="btn primary" type="submit">Save</button></form>';if(dlg.showModal)dlg.showModal();}
function applyTagSave(){var wo=woById(state.tagWoId);if(!wo){toast("Not found");return;}var kind=state.tagKind||"cable";var cc=String(state.tagChargeCode||"").trim();if(!cc){toast("Enter a charge code");return;}wo.instructionKind=kind;wo.chargeCode=cc;wo.complexity=String(state.tagComplexity||"medium").toLowerCase();if(["easy","medium","hard"].indexOf(wo.complexity)<0)wo.complexity="medium";if(kind==="product"){wo.assemblyId=String(state.tagAssemblyId||"");if(!wo.assemblyId){toast("Pick product WI");return;}var a=asmById(wo.assemblyId);wo.productTag=a?(a.productCode||a.name):"Product";wo.taskNotes="";applyWiHoursToOrder(wo);}else if(kind==="assembly"){wo.assemblyId="";wo.productTag="Assembly/POD";wo.hoursFromWi=false;wo.taskNotes="";}else if(kind==="task"){wo.assemblyId="";wo.productTag="Task Order";wo.hoursFromWi=false;wo.taskNotes=String(state.tagTaskNotes||"").trim();}else{wo.assemblyId="";wo.productTag="Cable";wo.hoursFromWi=false;wo.taskNotes="";}save();var d=document.getElementById("modal");if(d)d.close();toast(wo.number+" · "+wo.productTag+" · "+wo.chargeCode);render();}

document.addEventListener("submit",function(e){
  var nc=e.target.closest("[data-form=qa-nc]");
  if(nc){e.preventDefault();var fd=new FormData(nc);var cat=String(fd.get("category")||"").trim();var sev=String(fd.get("severity")||"major");var notes=String(fd.get("notes")||"").trim();if(!cat||!notes){toast("Category and notes required");return;}var pending=state.pendingNc;if(!pending)return;var tr=trById(state.activeTravelerId);if(!tr)return;writeQaFromOp(tr,pending.opId,"fail",pending.qaUser,{category:cat,severity:sev,notes:notes});state.pendingNc=null;state.pendingPin=null;syncWo(tr);save();var d=document.getElementById("modal");if(d)d.close();toast("QA fail recorded");render();return;}
  var spin=e.target.closest("[data-form=step-pin]");
  if(spin){e.preventDefault();var fd=new FormData(spin);var u=personByPin(fd.get("pin"));if(!u){toast("Invalid PIN");return;}var pending=state.pendingPin||{};var tr=trById(state.activeTravelerId);if(!tr){toast("No traveler");return;}var d=document.getElementById("modal");if(d)d.close();
    if(pending.purpose==="tech-done"){var opId=pending.payload.opId;if(!tr.opRecords[opId])tr.opRecords[opId]={};var rec=tr.opRecords[opId];rec.techDone=true;rec.techBy=u.name;rec.techId=u.id;rec.techAt=nowISO();rec.techNotes=state.pendingOpNotes||"";if(rec.startedAt){var ms=Date.now()-new Date(rec.startedAt).getTime();tr.totalMs=(tr.totalMs||0)+Math.max(0,ms);}var def=opDef(tr.kind==="assembly"?"assembly":"cable",opId);pushLog(tr,{type:"tech",text:rec.techNotes||"Tech complete",by:u.name,byId:u.id,opId:opId,opName:def?def.name:opId});state.pendingOpNotes="";state.pendingPin=null;syncWo(tr);save();toast("Signed by "+u.name);render();return;}
    if(pending.purpose==="qa-done"){var oid=pending.payload.opId;var result=pending.payload.result;if(result==="fail"){openNc(oid,u);return;}writeQaFromOp(tr,oid,"pass",u,null);state.pendingPin=null;syncWo(tr);save();toast("QA pass · "+u.name);render();return;}
    if(pending.purpose==="prod-step"){var i=pending.payload.i;if(tr.steps[i]){tr.steps[i].done=true;tr.steps[i].by=u.name;tr.steps[i].at=nowISO();pushLog(tr,{type:"step",text:stepText(tr.steps[i]),by:u.name,byId:u.id});}state.pendingPin=null;syncWo(tr);save();toast("Signed by "+u.name);render();return;}
    state.pendingPin=null;return;}
  var chg=e.target.closest("[data-form=change-pin]");
  if(chg){e.preventDefault();var fd2=new FormData(chg);var a=String(fd2.get("a")||"");var b=String(fd2.get("b")||"");if(a.length<4||a!==b||a==="1111"){toast("PIN issue");return;}var person=(state.data.people||[]).find(function(p){return String(p.id)===String(state.session.personId||state.session.userId);});if(!person)return;person.pin=a;person.mustChangePin=false;save();state.forceChangePin=false;toast("PIN updated");render();return;}
  var login=e.target.closest("[data-form=login]");
  if(login){e.preventDefault();var fd3=new FormData(login);var pid=String(fd3.get("personId")||"");var pin=String(fd3.get("pin")||"");var user=(state.data.people||[]).find(function(p){return String(p.id)===pid;});if(!user){state.loginError="Select your name.";render();return;}if(effectivePin(user)!==pin){state.loginError="Wrong PIN. First-time default is 1111.";render();return;}state.session={userId:user.id,name:user.name,role:user.role||"tech",personId:user.id};sessionStorage.setItem(SESSION_KEY,JSON.stringify(state.session));state.loginError="";state.forceChangePin=mustChangePin(user);toast("Signed in as "+user.name);render();}
});

try{load();render();if(!(state.data.workOrders||[]).length){var done=false;function finishFetch(d){if(done)return;done=true;if(d){state.data.workCenters=d.workCenters||state.data.workCenters;state.data.people=d.people||state.data.people;state.data.workOrders=d.workOrders||[];save();}render();}setTimeout(function(){finishFetch(null);},2500);try{fetch("capacity-data.json").then(function(r){return r.json();}).then(function(d){finishFetch(d);}).catch(function(){finishFetch(null);});}catch(e){finishFetch(null);}}}catch(bootErr){document.getElementById("app").innerHTML='<div class="wrap"><div class="err">Boot error: '+String(bootErr&&bootErr.message?bootErr.message:bootErr)+'</div></div>';}
})();
