<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem;flex-wrap:wrap}
.brand{display:flex;gap:.75rem;align-items:center}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent-ink);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;white-space:nowrap;font-size:.9rem}
.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(960px,100%);margin:0 auto;padding:1.25rem 1.15rem 3rem}
h2{margin:0 0 .35rem}.lede{color:var(--ink-soft);margin:0 0 1rem}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .75rem;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.danger{color:var(--over)}.btn.small{padding:.25rem .5rem;font-size:.82rem}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:100%;font:inherit}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;margin-bottom:1rem}
.wc-row,.emp-row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.75rem .85rem;background:var(--card);border:1px solid var(--rule);border-radius:12px;flex-wrap:wrap;margin-bottom:.5rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:.4rem}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:650;color:var(--ink-soft)}
.form-grid{display:grid;gap:.65rem;grid-template-columns:1fr 1fr;margin:1rem 0}
.form-grid .span-2{grid-column:1/-1}
dialog{border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(27,24,20,.45)}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:1.15rem;width:min(440px,94vw);box-shadow:var(--shadow)}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.4rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--accent-soft);color:var(--accent-ink)}
.help{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.grid a{text-decoration:none;color:inherit}
.err{color:var(--over);padding:1rem;background:#f6d9d2;border-radius:10px;margin:1rem 0}
</style>
</head>
<body>
<div class="top">
  <div class="top-row">
    <div class="brand"><div class="mark">SET</div><div><h1>Settings</h1><p>Work centers - roles - people</p></div></div>
    <div id="suite-auth-host"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap" id="main">Loading...</div>
<div class="toasts" id="toasts"></div>
<dialog id="modal"></dialog>
<script src="nav.js"></script>
<script src="Settings.app.js"></script>
</body>
</html>
