<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem;flex-wrap:wrap}
.brand{display:flex;gap:.75rem;align-items:center}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent-ink);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;white-space:nowrap;font-size:.9rem}
.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(960px,100%);margin:0 auto;padding:1.25rem 1.15rem 3rem}
h2{margin:0 0 .35rem}.lede{color:var(--ink-soft);margin:0 0 1rem}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .75rem;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.danger{color:var(--over)}.btn.small{padding:.25rem .5rem;font-size:.82rem}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:100%;font:inherit}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;margin-bottom:1rem}
.wc-row,.emp-row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.75rem .85rem;background:var(--card);border:1px solid var(--rule);border-radius:12px;flex-wrap:wrap;margin-bottom:.5rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:.4rem}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:650;color:var(--ink-soft)}
.form-grid{display:grid;gap:.65rem;grid-template-columns:1fr 1fr;margin:1rem 0}
.form-grid .span-2{grid-column:1/-1}
dialog{border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(27,24,20,.45)}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:1.15rem;width:min(440px,94vw);box-shadow:var(--shadow)}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.4rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--accent-soft);color:var(--accent-ink)}
.help{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.grid a{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="top">
  <div class="top-row">
    <div class="brand"><div class="mark">SET</div><div><h1>Settings</h1><p>Work centers · roles · people</p></div></div>
    <div id="suite-auth-host"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap" id="main">Loading…</div>
<div class="toasts" id="toasts"></div>
<dialog id="modal"></dialog>
<script src="roles.js"></script>
<script src="nav.js"></script>
<script>
(function(){
var STORAGE_KEY="capacity-tracker.v1";
var COLORS=["#1f6f6a","#1d4e89","#8a3b12","#6b4c9a","#3d5a40","#9a3412","#0f4c5c","#7a2f4b"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){if(ch==="&")return"\x26amp;";if(ch==="<")return"\x26lt;";if(ch===">")return"\x26gt;";if(ch==="\"")return"\x26quot;";return"\x26#39;";});}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);}
function toast(m){var el=document.createElement("div");el.className="toast";el.textContent=m;document.getElementById("toasts").appendChild(el);setTimeout(function(){el.remove();},2800);}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}catch(e){return {};}}
function save(data){data.updatedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
function roleLabel(r){return window.SuiteRoles?SuiteRoles.label(r):(r||"tech");}
function roleOpts(sel){return window.SuiteRoles?SuiteRoles.optionsHtml(sel):'<option value="tech">Floor Tech</option>';}
function isAdmin(){var s=window.SuiteRoles&&SuiteRoles.session();return !s||SuiteRoles.can("manageSettings",s)||SuiteRoles.roleOf(s)==="admin";}

function render(){
  document.getElementById("tabs").innerHTML=(window.SuiteNav&&SuiteNav.html("Settings"))||"";
  if(window.SuiteNav)SuiteNav.paintAuth();
  var d=load();
  var centers=d.workCenters||[];
  var people=(d.people||[]).slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  var html="";

  html+='<div class="card help"><b>Roles</b><br>Floor Tech — only assigned jobs; tech step sign-off; downtime create; analytics view.<br>QA — only assigned jobs; QA step sign-off; downtime create; analytics view.<br>Mfg Eng — edit work instructions; resolve downtime; set WI type.<br>Supervisor — assign work; create task orders; analytics.<br>Manager — create work orders; charge codes; assign; downtime view.<br>Admin — everything.</div>';

  html+='<div class="page-head"><div><h2>Work centers</h2><p class="lede">Ordering, Kitting, QA, production cells.</p></div>';
  html+='<button type="button" class="btn primary" data-action="new-wc">New work center</button></div>';
  if(!centers.length)html+='<div class="card"><p class="help" style="margin:0">No work centers yet.</p></div>';
  else centers.forEach(function(c){
    html+='<div class="wc-row"><div><span class="dot" style="background:'+esc(c.color||"#1f6f6a")+'"></span><b>'+esc(c.name)+'</b>';
    if(c.kind)html+=' <span class="pill">'+esc(c.kind)+'</span>';
    html+='</div><div><button type="button" class="btn small" data-action="edit-wc" data-id="'+esc(c.id)+'">Edit</button> ';
    html+='<button type="button" class="btn small danger" data-action="del-wc" data-id="'+esc(c.id)+'">Delete</button></div></div>';
  });

  html+='<div class="page-head" style="margin-top:1.75rem"><div><h2>Employees & roles</h2><p class="lede">Assign Floor Tech, QA, Mfg Eng, Supervisor, Manager, or Admin. PIN default 1111.</p></div>';
  html+='<button type="button" class="btn primary" data-action="new-emp">Add employee</button></div>';
  if(!people.length)html+='<div class="card"><p class="help" style="margin:0">No people yet. Add employees here or in Capacity Tracker roster.</p></div>';
  else people.forEach(function(p){
    html+='<div class="emp-row"><div><b>'+esc(p.name)+'</b> <span class="pill">'+esc(roleLabel(p.role))+'</span>';
    if(p.workCenterId){var wc=centers.find(function(c){return String(c.id)===String(p.workCenterId);});html+=' <span class="help">'+esc(wc?wc.name:"")+'</span>';}
    html+='</div><div style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center">';
    html+='<select class="field" style="width:auto;min-width:9rem" data-role-id="'+esc(p.id)+'">'+roleOpts(p.role||"tech")+'</select>';
    html+='<button type="button" class="btn small" data-action="reset-pin" data-id="'+esc(p.id)+'">Reset PIN 1111</button>';
    html+='<button type="button" class="btn small danger" data-action="del-emp" data-id="'+esc(p.id)+'">Remove</button></div></div>';
  });

  html+='<h2 style="margin-top:1.75rem">More</h2><div class="grid" style="margin-top:.75rem">';
  html+='<a class="card" href="CapacityTracker.html#people"><h3 style="margin:0 0 .35rem">Full roster</h3><p class="help" style="margin:0">Hours, PTO, center assign in Capacity Tracker.</p></a>';
  html+='<a class="card" href="SkillsMatrix.html"><h3 style="margin:0 0 .35rem">Skills matrix</h3><p class="help" style="margin:0">Training levels.</p></a>';
  html+='<a class="card" href="CapacityTracker.html#settings"><h3 style="margin:0 0 .35rem">Capacity settings</h3><p class="help" style="margin:0">Planning horizon, storage.</p></a></div>';

  document.getElementById("main").innerHTML=html;
}

function openWc(id){
  var d=load();var centers=d.workCenters||[];
  var existing=id?centers.find(function(c){return String(c.id)===String(id);}):null;
  var c=existing||{name:"",notes:"",color:COLORS[centers.length%COLORS.length],kind:""};
  var dlg=document.getElementById("modal");
  dlg.innerHTML='<form class="modal-card" data-form="wc" data-id="'+esc(existing?existing.id:"")+'"><h3 style="margin:0">'+(existing?"Edit":"New")+' work center</h3><div class="form-grid">'+
    '<label class="span-2">Name<input class="field" name="name" required value="'+esc(c.name)+'"></label>'+
    '<label>Kind<select class="field" name="kind"><option value="">General</option><option value="ordering"'+(c.kind==="ordering"?" selected":"")+'>Ordering</option><option value="kitting"'+(c.kind==="kitting"?" selected":"")+'>Kitting</option><option value="qa"'+(c.kind==="qa"?" selected":"")+'>QA</option></select></label>'+
    '<label>Color<input class="field" type="color" name="color" value="'+esc(c.color||"#1f6f6a")+'"></label>'+
    '<label class="span-2">Notes<textarea class="field" name="notes" rows="2">'+esc(c.notes||"")+'</textarea></label></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:.5rem"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
  dlg.showModal();
}
function openEmp(){
  var d=load();var centers=d.workCenters||[];
  var dlg=document.getElementById("modal");
  dlg.innerHTML='<form class="modal-card" data-form="emp"><h3 style="margin:0">Add employee</h3><div class="form-grid">'+
    '<label class="span-2">Name<input class="field" name="name" required></label>'+
    '<label>Role<select class="field" name="role">'+roleOpts("tech")+'</select></label>'+
    '<label>Work center<select class="field" name="workCenterId"><option value="">Unassigned</option>'+centers.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join("")+'</select></label>'+
    '<label class="span-2">Hours / week<input class="field" name="hoursPerWeek" type="number" value="40" min="0" step="0.5"></label></div>'+
    '<p class="help">PIN starts at 1111. They change it on first Work Orders login.</p>'+
    '<div style="display:flex;justify-content:space-between;margin-top:.5rem"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
  dlg.showModal();
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-action]");if(!b)return;
  var a=b.getAttribute("data-action");
  if(a==="new-wc")openWc("");
  if(a==="edit-wc")openWc(b.getAttribute("data-id"));
  if(a==="new-emp")openEmp();
  if(a==="close"){var m=document.getElementById("modal");if(m)m.close();}
  if(a==="del-wc"){
    if(!confirm("Delete this work center?"))return;
    var id=b.getAttribute("data-id");var d=load();
    d.workCenters=(d.workCenters||[]).filter(function(c){return String(c.id)!==String(id);});
    (d.people||[]).forEach(function(p){if(String(p.workCenterId)===String(id))p.workCenterId="";});
    (d.workOrders||[]).forEach(function(o){if(String(o.workCenterId)===String(id))o.workCenterId="";});
    save(d);toast("Deleted");render();
  }
  if(a==="del-emp"){
    if(!confirm("Remove employee?"))return;
    var id=b.getAttribute("data-id");var d=load();
    d.people=(d.people||[]).filter(function(p){return String(p.id)!==String(id);});
    save(d);toast("Removed");render();
  }
  if(a==="reset-pin"){
    var id=b.getAttribute("data-id");var d=load();
    var p=(d.people||[]).find(function(x){return String(x.id)===String(id);});
    if(!p)return;p.pin="1111";p.mustChangePin=true;save(d);toast(p.name+" PIN reset to 1111");
  }
});

document.addEventListener("change",function(e){
  var sel=e.target.closest("[data-role-id]");
  if(!sel)return;
  var id=sel.getAttribute("data-role-id");
  var d=load();
  var p=(d.people||[]).find(function(x){return String(x.id)===String(id);});
  if(!p)return;
  p.role=window.SuiteRoles?SuiteRoles.norm(sel.value):sel.value;
  save(d);toast(p.name+" → "+roleLabel(p.role));
});

document.addEventListener("submit",function(e){
  var form=e.target.closest("[data-form]");if(!form)return;
  e.preventDefault();
  var fd=new FormData(form);
  var d=load();
  if(form.getAttribute("data-form")==="wc"){
    if(!d.workCenters)d.workCenters=[];
    var id=form.getAttribute("data-id")||"";
    var rec={id:id||uid("wc"),name:String(fd.get("name")||"").trim()||"Untitled",kind:String(fd.get("kind")||""),color:String(fd.get("color")||"#1f6f6a"),notes:String(fd.get("notes")||"")};
    var idx=d.workCenters.findIndex(function(c){return String(c.id)===String(rec.id);});
    if(idx>=0)d.workCenters[idx]=Object.assign({},d.workCenters[idx],rec);else d.workCenters.push(rec);
    save(d);document.getElementById("modal").close();toast("Work center saved");render();
  }
  if(form.getAttribute("data-form")==="emp"){
    if(!d.people)d.people=[];
    var role=window.SuiteRoles?SuiteRoles.norm(fd.get("role")):String(fd.get("role")||"tech");
    d.people.push({id:uid("p"),name:String(fd.get("name")||"").trim()||"Unnamed",role:role,workCenterId:String(fd.get("workCenterId")||""),hoursPerWeek:Number(fd.get("hoursPerWeek"))||40,workDays:5,efficiency:100,pin:"1111",mustChangePin:true,notes:""});
    save(d);document.getElementById("modal").close();toast("Employee added · PIN 1111");render();
  }
});

render();
})();
</script>
</body>
</html>
