<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtime</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--card-2:#f7f1e6;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--over-soft:#f6d9d2;--healthy:#2d6a3a;--healthy-soft:#d7ead9;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem;flex-wrap:wrap}
.brand{display:flex;gap:.75rem;align-items:center}.mark{width:36px;height:36px;border-radius:10px;background:var(--over);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;font-size:.9rem;white-space:nowrap}
.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(1100px,100%);margin:0 auto;padding:1.1rem 1.15rem 3rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.kpi,.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem}
.kpi .label{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.kpi .value{font-size:1.55rem;font-weight:650}
.kpi.over{background:linear-gradient(180deg,#fff8f5,var(--card))}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .7rem;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.danger{color:var(--over)}.btn.small{padding:.25rem .5rem;font-size:.82rem}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:100%}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--card-2)}
.pill.open{background:var(--over-soft);color:var(--over)}
.pill.closed{background:var(--healthy-soft);color:var(--healthy)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.empty{text-align:center;padding:2rem;color:var(--ink-soft)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem;align-items:center}
.err{color:var(--over);padding:1rem;background:#f6d9d2;border-radius:10px;margin:1rem 0}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.35rem}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p>Loading downtime…</p></div></div>
<script>
(function () {
  var STORAGE_KEY = "capacity-tracker.v1";
  var REASONS = {
    material: "Waiting on material",
    tooling: "Tooling / setup",
    machine: "Machine issue",
    engineering: "Engineering question",
    quality: "Quality hold",
    personnel: "Missing personnel",
    instruction: "Work instruction unclear",
    other: "Other"
  };

  var state = {
    workCenters: [],
    people: [],
    workOrders: [],
    downtime: [],
    filterOpenOnly: true,
    filterCenter: ""
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      if (ch === "&") return "\x26amp;";
      if (ch === "<") return "\x26lt;";
      if (ch === ">") return "\x26gt;";
      if (ch === '"') return "\x26quot;";
      return "\x26#39;";
    });
  }

  function load() {
    try {
      var p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      state.workCenters = p.workCenters || [];
      state.people = p.people || [];
      state.workOrders = p.workOrders || [];
      state.downtime = Array.isArray(p.downtime) ? p.downtime : [];
    } catch (e) {
      state.downtime = [];
    }
  }

  function save() {
    var base = {};
    try {
      base = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      base = {};
    }
    base.downtime = state.downtime;
    base.updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(base));
  }

  function toast(m) {
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = m;
    (document.querySelector(".toasts") || document.body).appendChild(el);
    setTimeout(function () {
      el.remove();
    }, 2800);
  }

  function centerName(id) {
    for (var i = 0; i < state.workCenters.length; i++) {
      if (String(state.workCenters[i].id) === String(id)) return state.workCenters[i].name;
    }
    return "—";
  }

  function personName(id) {
    for (var i = 0; i < state.people.length; i++) {
      if (String(state.people[i].id) === String(id)) return state.people[i].name;
    }
    return "—";
  }

  function reasonLabel(id) {
    return REASONS[id] || id || "—";
  }

  function filtered() {
    var list = state.downtime.slice();
    if (state.filterOpenOnly) {
      list = list.filter(function (d) {
        return d.status === "open";
      });
    }
    if (state.filterCenter) {
      list = list.filter(function (d) {
        return String(d.workCenterId) === String(state.filterCenter);
      });
    }
    return list;
  }

  function closeLog(id) {
    for (var i = 0; i < state.downtime.length; i++) {
      if (state.downtime[i].id === id) {
        state.downtime[i].status = "closed";
        var now = new Date();
        state.downtime[i].endDate =
          now.getFullYear() +
          "-" +
          String(now.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(now.getDate()).padStart(2, "0");
        state.downtime[i].endTime =
          String(now.getHours()).padStart(2, "0") +
          ":" +
          String(now.getMinutes()).padStart(2, "0");
        break;
      }
    }
    save();
    toast("Closed");
    render();
  }

  function removeLog(id) {
    if (!confirm("Delete this downtime entry?")) return;
    state.downtime = state.downtime.filter(function (d) {
      return d.id !== id;
    });
    save();
    toast("Deleted");
    render();
  }

  function render() {
    try {
      var open = state.downtime.filter(function (d) {
        return d.status === "open";
      }).length;
      var list = filtered();

      var centerOpts = state.workCenters
        .map(function (c) {
          return (
            '<option value="' +
            esc(c.id) +
            '"' +
            (String(state.filterCenter) === String(c.id) ? " selected" : "") +
            ">" +
            esc(c.name) +
            "</option>"
          );
        })
        .join("");

      var rows = list
        .map(function (d) {
          return (
            "<tr>" +
            "<td>" +
            esc(d.startDate || "") +
            " " +
            esc(d.startTime || "") +
            "</td>" +
            "<td><b>" +
            esc(d.workOrderNumber || "—") +
            "</b>" +
            (d.workOrderTitle
              ? '<div style="font-size:.8rem;color:var(--ink-soft)">' +
                esc(d.workOrderTitle) +
                "</div>"
              : "") +
            "</td>" +
            "<td>" +
            esc(centerName(d.workCenterId)) +
            "</td>" +
            "<td>" +
            esc(reasonLabel(d.reason)) +
            "</td>" +
            "<td>" +
            esc(d.personName || personName(d.personId)) +
            "</td>" +
            '<td><span class="pill ' +
            (d.status === "open" ? "open" : "closed") +
            '">' +
            esc(d.status || "open") +
            "</span></td>" +
            "<td>" +
            (d.notes ? esc(d.notes) : "—") +
            "</td>" +
            '<td style="white-space:nowrap">' +
            (d.status === "open"
              ? '<button class="btn small primary" data-action="close" data-id="' +
                esc(d.id) +
                '">Close</button> '
              : "") +
            '<button class="btn small danger" data-action="delete" data-id="' +
            esc(d.id) +
            '">x</button></td></tr>'
          );
        })
        .join("");

      document.getElementById("app").innerHTML =
        '<div class="top"><div class="top-row"><div class="brand"><div class="mark">DT</div><div><h1>Downtime</h1><p>Issues from the floor · tied to work orders</p></div></div></div>' +
        '<nav class="tabs">' +
        '<a class="tab" href="CapacityTracker.html#dashboard">Work Centers</a>' +
        '<a class="tab" href="CapacityTracker.html#planning">Planning</a>' +
        '<a class="tab" href="WorkOrders.html">Work Orders</a>' +
        '<a class="tab" href="WipBoard.html">WIP Board</a>' +
        '<a class="tab" href="WorkInstructions.html">Work Instructions</a>' +
        '<a class="tab is-on" href="DowntimeLogger.html">Downtime</a>' +
        '<a class="tab" href="Analytics.html">Analytics</a>' +
        '<a class="tab" href="Settings.html">Settings</a>' +
        "</nav></div>" +
        '<div class="wrap">' +
        '<h2 style="margin:0 0 .35rem">Downtime overview</h2>' +
        '<p style="color:var(--ink-soft);margin:0 0 1rem">Techs report from Work Orders. This page is the board.</p>' +
        '<div class="kpis">' +
        '<div class="kpi' +
        (open ? " over" : "") +
        '"><div class="label">Open</div><div class="value">' +
        open +
        "</div></div>" +
        '<div class="kpi"><div class="label">Total logged</div><div class="value">' +
        state.downtime.length +
        "</div></div>" +
        '<div class="kpi"><div class="label">Work centers</div><div class="value">' +
        state.workCenters.length +
        "</div></div>" +
        '<div class="kpi"><div class="label">Open jobs</div><div class="value">' +
        state.workOrders.filter(function (o) {
          return o.status !== "complete";
        }).length +
        "</div></div></div>" +
        '<div class="card">' +
        '<div class="filters">' +
        '<label style="font-size:.85rem;display:flex;align-items:center;gap:.35rem"><input type="checkbox" id="fOpen"' +
        (state.filterOpenOnly ? " checked" : "") +
        "> Open only</label>" +
        '<select class="field" style="width:auto;min-width:10rem" id="fCenter">' +
        '<option value="">All centers</option>' +
        centerOpts +
        "</select>" +
        '<button class="btn small" type="button" id="btnReload">Reload</button>' +
        "</div>" +
        (list.length
          ? '<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Job</th><th>Center</th><th>Reason</th><th>By</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>' +
            rows +
            "</tbody></table></div>"
          : '<div class="empty">No downtime events yet.<br><br>On <b>Work Orders</b>, press <b>Downtime</b> on a job to report one.</div>') +
        "</div></div><div class="toasts"></div>";

      var fo = document.getElementById("fOpen");
      if (fo)
        fo.onchange = function () {
          state.filterOpenOnly = fo.checked;
          render();
        };
      var fc = document.getElementById("fCenter");
      if (fc)
        fc.onchange = function () {
          state.filterCenter = fc.value;
          render();
        };
      var br = document.getElementById("btnReload");
      if (br)
        br.onclick = function () {
          load();
          toast("Reloaded");
          render();
        };
    } catch (err) {
      document.getElementById("app").innerHTML =
        '<div class="wrap"><div class="err">Downtime error: ' +
        esc(err && err.message ? err.message : String(err)) +
        "</div></div>";
    }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var a = b.getAttribute("data-action");
    var id = b.getAttribute("data-id") || "";
    if (a === "close") closeLog(id);
    if (a === "delete") removeLog(id);
  });

  try {
    load();
    render();
  } catch (boot) {
    document.getElementById("app").innerHTML =
      '<div class="wrap"><div class="err">Boot failed: ' +
      String(boot && boot.message ? boot.message : boot) +
      "</div></div>";
  }
})();
</script>
</body>
</html>
