<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downtime</title>
<style>
:root{--paper:#f3efe6;--ink:#1b1814;--ink-soft:#5c564c;--rule:#d4cbb8;--card:#fffcf6;--card-2:#f7f1e6;--accent-ink:#0e3d3a;--accent-soft:#d5ebe8;--over:#9b2c1a;--over-soft:#f6d9d2;--healthy:#2d6a3a;--healthy-soft:#d7ead9;--shadow:0 1px 0 rgba(27,24,20,.06),0 12px 28px rgba(27,24,20,.08);--radius:14px;--sans:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.95);border-bottom:1px solid var(--rule)}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.25rem .35rem;gap:1rem;flex-wrap:wrap}
.brand{display:flex;gap:.75rem;align-items:center}.mark{width:36px;height:36px;border-radius:10px;background:var(--over);color:#f4efe4;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.brand h1{margin:0;font-size:1.05rem}.brand p{margin:0;color:var(--ink-soft);font-size:.78rem}
.tabs{display:flex;gap:.1rem;padding:0 1rem .4rem;overflow-x:auto;flex-wrap:wrap}
.tab{color:var(--ink-soft);padding:.45rem .7rem;border-radius:999px;text-decoration:none;font-size:.9rem;white-space:nowrap}
.tab.is-on{background:var(--accent-ink);color:#f6f1e7}
.wrap{width:min(1100px,100%);margin:0 auto;padding:1.1rem 1.15rem 3rem}
h2{margin:0 0 .35rem}.lede{color:var(--ink-soft);margin:0 0 1rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.kpi,.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem}
.kpi .label{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.kpi .value{font-size:1.55rem;font-weight:650}
.kpi.over{background:linear-gradient(180deg,#fff8f5,var(--card))}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:.4rem .7rem;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent-ink);color:#f6f1e7;border-color:var(--accent-ink)}
.btn.danger{color:var(--over)}.btn.small{padding:.25rem .5rem;font-size:.82rem}
.field{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:.4rem .65rem;width:auto;min-width:10rem}
.pill{display:inline-flex;border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:650;background:var(--card-2)}
.pill.open{background:var(--over-soft);color:var(--over)}
.pill.closed{background:var(--healthy-soft);color:var(--healthy)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;color:var(--ink-soft)}
.empty{text-align:center;padding:2rem;color:var(--ink-soft)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem;align-items:center}
.chk{font-size:.85rem;display:flex;align-items:center;gap:.35rem}
.err{color:var(--over);padding:1rem;background:#f6d9d2;border-radius:10px;margin:1rem 0}
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:40}.toast{background:var(--accent-ink);color:#f6f1e7;padding:.65rem .8rem;border-radius:10px;margin-top:.35rem}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p>Loading downtime...</p></div></div>
<script src="DowntimeLogger.app.js" onerror="document.getElementById('app').innerHTML='<div class=wrap><div class=err><b>Could not load DowntimeLogger.app.js</b><br>Put DowntimeLogger.app.js in the same folder as this HTML file (not inside js/). Run Start-CapacityTracker.bat and open http://127.0.0.1:8765/DowntimeLogger.html</div></div>'"></script>
</body>
</html>
